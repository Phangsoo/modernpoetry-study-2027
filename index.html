<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>2027 수능 현대시 주제 학습</title>
<style>
:root{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:#25302f;background:#f7f5f0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.wrap{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.brand{font-size:12px;letter-spacing:.16em;font-weight:800;color:#608077}.count{color:#697a76;font-size:14px;font-weight:650}.track{height:5px;border-radius:40px;background:#e2e6de;overflow:hidden;margin-bottom:23px}.fill{height:100%;background:#4b7567;width:0%;transition:width .3s}.panel{min-height:490px;background:#fff;border:1px solid #eaece5;border-radius:25px;box-shadow:0 20px 65px rgba(33,49,43,.07);padding:55px 42px 42px;display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;color:#5f8578;margin-bottom:20px}.prompt{font-size:clamp(18px,3.4vw,24px);font-weight:650;line-height:1.5;color:#4f625b;margin:0 0 52px}.work{font-size:clamp(25px,5.2vw,42px);letter-spacing:-.055em;line-height:1.55;font-weight:800;word-break:keep-all;margin:auto 0}.answerHead{font-size:14px;letter-spacing:.12em;font-weight:750;color:#6c8e81;margin:3px 0 23px}.topic{font-size:clamp(24px,4.3vw,33px);line-height:1.65;font-weight:800;letter-spacing:-.035em;word-break:keep-all;margin:0}.quote{white-space:pre-line;font-size:clamp(14px,2.3vw,17px);font-weight:400;color:#7a817e;line-height:1.9;word-break:keep-all;margin:24px 0 0}.ref{font-size:13px;color:#9caaa3;margin-top:29px}.button{border:0;cursor:pointer;background:#3d6b5b;color:white;font-weight:760;font-size:17px;padding:19px 34px;border-radius:14px;min-height:59px;width:100%;transition:background .2s,transform .15s}.button:hover{background:#315a4d}.button:active{transform:scale(.99)}.bottom{margin-top:auto;padding-top:48px;width:100%}.secondary{display:block;margin:18px auto 0;border:0;background:none;color:#78857e;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.hint{font-size:12px;margin-top:19px;color:#9aa5a0;text-align:center}.hidden{display:none!important}.finished h2{font-size:34px;margin:4px 0 14px}.finished p{color:#74837b;line-height:1.8}.finished .button{margin-top:38px}@media(max-width:520px){body{padding:18px 13px}.panel{padding:43px 23px 30px;min-height:500px;border-radius:21px}.prompt{margin-bottom:35px}.bottom{padding-top:42px}.top{margin:0 6px 15px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">2027 EBS · 현대시 주제 학습</div><div class="count" id="count" aria-live="polite"></div></header><div class="track"><div class="fill" id="fill"></div></div><section class="panel" aria-live="polite"><div id="question" style="display:flex;flex:1;flex-direction:column;align-items:center;width:100%"><div class="eyebrow">주제 떠올리기</div><h1 class="prompt">제목을 보고 주제를 떠올려 보세요</h1><div class="work" id="work"></div><div class="bottom"><button class="button" id="reveal">주제 확인하기</button></div></div><div id="answer" class="hidden" style="display:flex;flex:1;flex-direction:column;align-items:center;width:100%"><div class="answerHead">작품의 주제</div><div class="topic" id="topic"></div><div class="quote" id="quote"></div><div class="ref" id="ref"></div><div class="bottom"><button class="button" id="next">다음 작품 <span aria-hidden="true">→</span></button></div></div><div id="finished" class="finished hidden"><div class="eyebrow">학습 완료</div><h2>모든 작품을 확인했어요!</h2><p id="finishText"></p><button class="button" id="restart">다시 랜덤 학습하기 ↻</button></div></section><div class="hint">Enter / Space 키로도 다음 단계로 이동할 수 있습니다.</div></main>
<script>const works=[{"author": "김소월", "title": "길", "topic": "일제강점기, 고향을 잃고 ‘길’을 떠도는 나그네의 비애", "quote": "갈래갈래 갈린 길\n길이라도\n내게 바이 갈 길은 하나 없소"}, {"author": "이용악", "title": "하나씩의 별", "topic": "해방 직후 고국으로 돌아오는 동료들의 불안한 현실과 희망", "quote": "우리 제각기 드러누워\n한결같이 쳐다보는 하나씩의 별"}, {"author": "이상화", "title": "빼앗긴 들에도 봄은 오는가", "topic": "들판에 찾아운 아름다운 봄, 그러나 일제에 의해 빼앗긴 국토", "quote": "푸른 웃음 푸른 설움이 어우러진 사이로\n다리를 절며 하루를 걷는다"}, {"author": "구상", "title": "초토의 시1", "topic": "불타는 전쟁의 땅(초토)에서 느끼는 비극과 그 속에서 발견한 희망", "quote": "소녀의 미소엔 앞니가 빠져\n죄 하나도 없다"}, {"author": "정지용", "title": "오월 소식", "topic": "5월에 받은 소식에서 느끼는 친구에 대한 그리움과 걱정", "quote": "일본 말과 아라비아 글씨를 가르치러 간\n쬐끄만 이 페스탈로치야, 꾀고리 같은 선생님이야"}, {"author": "김광균", "title": "와사등", "topic": "도시 문명 속에서 느끼는 현대인의 고독과 비애", "quote": "차단-한 등불이 하나\n비인 하늘에 걸려 있다.\n내 호올로 어델 가라는 슬픈 신호냐"}, {"author": "김기림", "title": "연륜", "topic": "과거의 초라한 삶에서 벗어나 열정적인 삶을 살아가겠다는 의지", "quote": "주름 잡히는 연륜마저 끊어 버리고\n나도 또한 불꽃처럼 열심히 살리라"}, {"author": "박재삼", "title": "정릉 살면서", "topic": "투병을 겪은 뒤, 정릉 살면서 받은 자연으로부터의 위로", "quote": "이 눈물 나게 넘치는 자산을\n혼자 아껴서 곱게 가지리로다"}, {"author": "이육사", "title": "꽃", "topic": "일제강점기, 극한의 시련 속에서도 생명을 피워내는 꽃과 같은 희망", "quote": "비 한 방울 내리지 않는 그때에도\n오히려 꽃은 빨갛게 피지 않는가"}, {"author": "이성부", "title": "누룩", "topic": "누룩처럼 자기희생을 통해 민중들이 만드는 새로운 역사", "quote": "지가 죽어 썩어 문드러져\n우리 고향 좋은 물 만나면\n덩달아서 함께 끓는 마음을 알겠느냐"}, {"author": "김규동", "title": "나비와 광장", "topic": "현대문명의 폭력 속에서 연약한 존재가 겪는 상처와 저항", "quote": "흰나비는\n돌진의 방향을 잊어버리고\n피 묻은 육체의 파편들을 굽어본다"}, {"author": "이형기", "title": "민들레꽃", "topic": "질 운명임에도 척박함 속에서 꽃을 피워내는 민들레의 생명력", "quote": "아 민들레! 그래 봤자\n혼자 가는 자의 헛된 꿈\n하지만 헛되어도 좋은 꿈 아니냐"}, {"author": "김수영", "title": "그 방을 생각하며", "topic": "4.19 이후 혁명 정신의 퇴색으로 인한 냉소와 자조", "quote": "혁명은 안 되고 나는 방만 바꾸어 버렸다"}, {"author": "황동규", "title": "달밤", "topic": "어려운 현실 속에서도 순수한 내면을 지키려는 의지", "quote": "갑자기 구름 개인 들판을 걸어갈 때\n헐벗은 옷 가득히 받는 달빛 달빛."}, {"author": "조지훈", "title": "눈 오는 날에", "topic": "지난날의 자랑과 보람이 떠나간 마음에 위로처럼 내리는 포근한 눈", "quote": "절망이란 오히려\n나리는 눈처럼 포근하고나"}, {"author": "이수익", "title": "유등제", "topic": "현실에서 떠나 극락으로 가라는 의식인 ‘유등제’를 보고 싶은 마음", "quote": "아득히 행렬을 이루면서 어둠 속으로 흘러가는\n그 눈물 글썽이는 축복의 제의를\n나는 보고 싶다"}, {"author": "신동집", "title": "포스터 속의 비둘기", "topic": "포스터 속의 비둘기로 비유된, 자유와 생명력을 잃은 현대인의 삶", "quote": "포스터 속에는 \n비둘기가 날아 볼 하늘이 없다\n마셔 볼 공기가 없다"}, {"author": "최승호", "title": "대설주의보", "topic": "계엄령처럼 쏟아지는 ‘대설’을 통해 억압적 시대 현실 형상화", "quote": "해일처럼 굽이치는 백색의 산과 골짜기에\n눈보라가 내리는 백색의 계엄령"}, {"author": "이성복", "title": "그 여름의 끝", "topic": "‘절망’의 과정을 여름에 핀 백일홍에 빗대어 표현한 시", "quote": "그 여름 나의 절망은 장난처럼 붉은 꽃들을 매달았지만\n여러 차례 폭풍에도 쓰러지지 않았습니다."}, {"author": "오세영", "title": "원시", "topic": "나이가 들어 ‘원시’를 얻고 느낀 이별에 대한 성숙한 수용", "quote": "늙는다는 것은 사랑하는 사람을 멀리 보낸다는 것이다.\n머얼리서 바라볼 줄을 안다는 것이다"}, {"author": "손택수", "title": "차심", "topic": "‘찻잔의 금’을 의미하는 ‘차심’을 통해 유추하는 관계 회복의 소망", "quote": "갈라진 너와 나 사이에도 그런 빛깔을 우릴 수 있다면"}, {"author": "송수권", "title": "며느리밥풀꽃", "topic": "시련 속에서도 이어 가는 (민중들의) 끈질긴 생명력", "quote": "혀끝에 감춘 밥알 두 알\n몰래몰래 울음 훔쳐 먹고 그 울음도 지쳐 추스림 끝에 피는 꽃"}, {"author": "한용운", "title": "낙원은 가시덤불에서", "topic": "고통스러운 현실을 극복하고 이상적 세계를 건설하려는 의지", "quote": "고통의 가시덤불 뒤에 환희의 낙원을 건설하기 위하여\n님을 떠난 나는, 아아 행복입니다."}, {"author": "신경림", "title": "산에 대하여", "topic": "‘낮은 산’을 통해 깨닫는 인간적인 삶의 가치", "quote": "사람이 다 크고 잘난 것만이 아니듯\n다 외치며 우뚝 서 있는 것이 아니듯\n산이라 해서 모두 크고 높은 것은 아니다"}, {"author": "윤동주", "title": "참회록", "topic": "역사적 자아에 대한 치열한 자기 성찰과 참회", "quote": "밤이면 밤마다 나의 거울을\n손바닥으로 발바닥으로 닦아 보자"}, {"author": "허형만", "title": "녹을 닦으며-공초14", "topic": "대문의 녹을 닦으며 느끼는 과거 삶에 대한 성찰과 반성", "quote": "흑갈빛 대문의 녹을 닦으며\n내 지나온 생애에는\n얼마나 지독한 녹이 슬어 있을지"}, {"author": "김기택", "title": "멸치", "topic": "멸치를 통해 느끼는 생명력을 상실한 존재에 대한 성찰", "quote": "지금도 멸치의 몸통을 뒤틀고 있는 이 작은 무늬가\n파도를 만들고 해일을 부르고\n고깃배를 부수고 그물을 찢었던 것이다"}, {"author": "복효근", "title": "버팀목에 대하여", "topic": "버팀목처럼 서로를 지탱해 주며 살아가는 이타적 삶의 가치", "quote": "만져 보면 죽은 아버지가 버팀목으로 만져지고\n사라진 이웃들도 만져집니다"}, {"author": "문태준", "title": "강을 따라갔다 돌아왔다", "topic": "상실의 필연성과 인생의 무상함에 대한 성찰", "quote": "누가 있을까, 강을 따라갔다 돌아오지 않는 이\n돌담을 둘렀으나 유량과 흐름을 지닌 무덤으로 돌아왔다"}, {"author": "고정희", "title": "모든 사라지는 것들은 뒤에 여백을 남긴다", "topic": "죽음으로 인한 존재의 빈자리에서 발견하는 위안과 여백", "quote": "나도 너로부터 사라지는 날\n네 발 아래로 쟁쟁쟁 흘러가는 시냇물 같은\n고요한 여백으로 남고 싶다"}, {"author": "나희덕", "title": "사과밭을 지나며", "topic": "이별의 아픔과 미련을 수용함으로써 얻은 내면의 평온", "quote": "툭, 떨어지는 사과 한 알\n사과 한 알을 내려놓는 데\n오 년이 걸렸다"}, {"author": "박목월", "title": "산이 날 에워싸고", "topic": "자연의 섭리에 순응하며 소박하게 살아가고자 하는 삶의 자세", "quote": "산이 날 에워싸고\n씨나 뿌리며 살아라 한다\n밭이나 갈며 살아라 한다"}, {"author": "문정희", "title": "흐름에 대하여", "topic": "죽을 수밖에 없는 존재의 숙명과 비애", "quote": "우리들은 왜 바다가 되지 못하고\n한 벌 죽음으로 자유와 햇살 빼앗기고\n다만 혼자 제 목숨 갖고 가는가"}, {"author": "서정주", "title": "자화상", "topic": "고통스러운 삶에 대한 회고와 강렬한 생의 의지", "quote": "나는 아무것도 뉘우치지 않을란다\n찬란히 트여 오는 어느 아침에도\n이마 위에 얹힌 시의 이슬에는 몇 방울의 피가 언제나 섞여 있어"}, {"author": "신경림", "title": "목계장터", "topic": "유랑과 정착 사이에서 갈등하는 민중의 애환과 삶의 비애", "quote": "하늘은 날더러 바람이 되라 하고\n한은 날더러 잔돌이 되라 하네"}, {"author": "백석", "title": "흰 바람벽이 있어", "topic": "가난하고 외로운 삶속에서 고결한 삶의 자세를 지키려는 의지", "quote": "하늘이 이 세상을 내일 적에 그가 가장 귀해하고 사랑하는 것들은 모두 가난하고 외롭고 높고 쓸쓸하니 그리고 언제나 넘치는 사랑과 슬픔 속에 살도록 만드신 것이다"}, {"author": "안도현", "title": "연탄 한 장", "topic": "타인을 위해 희생하는 삶의 가치와 이기적인 자신의 삶 반성", "quote": "삶이란\n나 아닌 그 누구에게\n기꺼이 연탄 한 장 되는 것"}, {"author": "정한모", "title": "나비의 여행", "topic": "전쟁과 현대 문명의 폭력성 비판과 순수한 생명에 대한 연민", "quote": "아가야, 오늘은 어느 사나운 골짜기에서\n공포의 독수리를 만나 소스라쳐 돌아왔느냐"}, {"author": "박남수", "title": "새1", "topic": "순수한 존재를 위협하는 인간 문명의 폭력성에 대한 비판", "quote": "포수는 한 덩이 납으로 그 순수를 겨냥하지만\n매양 쏘는 것은 피에 젖은 한마리 상한 새에 지나지 않는다"}, {"author": "김수영", "title": "눈", "topic": "눈처럼 순수한 삶에 대한 갈망과 부정적 현실의 극복 의지", "quote": "젊은 시인이여 기침을 하자\n눈을 바라보며\n밤새도록 고인 가슴의 가래라도 마음껏 뱉자"}, {"author": "문정희", "title": "한계령을 위한 연가", "topic": "오히려 대상과 함께 고립되기를 소망하는 사랑의 갈망", "quote": "아름다운 한계령에 기꺼이 묶여\n난생처음 짧은 축복에 몸 둘 바를 모르리"}, {"author": "윤동주", "title": "쉽게 씌어진 시", "topic": "암울한 식민지 현실 속에서의 자기 성찰과 현실 극복의 의지", "quote": "인생은 살기 어렵다는데\n시가 이렇게 쉽게 씌어지는 것은\n부끄러운 일이다"}, {"author": "황동규", "title": "기항지1", "topic": "낯선 기항지의 풍경을 통해 느끼는 삶의 고독과 갈등", "quote": "정박 중인 어두운 용골들이\n모두 고개를 들고\n항구의 안을 들여다보고 있었다"}, {"author": "김소월", "title": "삼수갑산-차안서선생삼수갑산운", "topic": "삼수갑산에 갇혀 고향에 돌아갈 수 없는 절망과 탄식", "quote": "내 고향을 가고지고 오호 삼수갑산 날 가두었네\n불귀로다 내 몸이야 아아 삼수갑산 못 벗어난다 아하하"}, {"author": "박목월", "title": "이별가", "topic": "사별로 인한 슬픔과 삶과 죽음의 경계를 초월한 그리움", "quote": "뭐락카노 뭐락카노 뭐락카노,\n이승 아니면 저승에서라도.."}];
const $=id=>document.getElementById(id);let order=[],cursor=0,mode='question';
function shuffle(){order=Array.from({length:works.length},(_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
function show(id){for(const v of ['question','answer','finished'])$(v).classList.toggle('hidden',v!==id);}
function progress(){const completed=mode==='done'?works.length:cursor+(mode==='answer'?1:0);$('count').textContent=`${Math.min(completed,works.length)} / ${works.length} 작품`; $('fill').style.width=`${completed/works.length*100}%`;}
function question(){mode='question';const w=works[order[cursor]];$('work').textContent=`${w.author}, 「${w.title}」`;show('question');progress();}
function reveal(){if(mode!=='question')return;mode='answer';const w=works[order[cursor]];$('topic').textContent=w.topic;$('quote').textContent='“'+w.quote+'”';$('ref').textContent=`${w.author}, 「${w.title}」`;show('answer');$('next').innerHTML=cursor===works.length-1?'학습 마치기 <span aria-hidden="true">✓</span>':'다음 작품 <span aria-hidden="true">→</span>';progress();}
function next(){if(mode!=='answer')return;cursor++;if(cursor===works.length){mode='done';show('finished');$('finishText').textContent=`총 ${works.length}편의 현대시 주제를 모두 살펴봤습니다.`;progress()}else question();}
function restart(){shuffle();cursor=0;question()}
$('reveal').addEventListener('click',reveal);$('next').addEventListener('click',next);$('restart').addEventListener('click',restart);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.code==='Space')&&!['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(mode==='question')reveal();else if(mode==='answer')next();else restart();}});restart();</script></body></html>
